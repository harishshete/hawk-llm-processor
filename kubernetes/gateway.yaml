apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hawk-ai-gateway
  namespace: hawk
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: infer.hawk-llm.ai
    - name: grpc
      protocol: HTTP
      port: 6334
      hostname: infer.hawk-llm.ai
#    - name: https
#      protocol: HTTPS
#      port: 443
#      hostname: hawk.k8s.net
#      tls:
#        mode: Terminate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hawk-route
  namespace: hawk
spec:
  parentRefs:
    - name: hawk-ai-gateway
  hostnames:
    - infer.hawk-llm.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/rag
      backendRefs:
        - name: rag-gateway-service
          port: 80  
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: qwen-3-service
          port: 80
    - matches: 
        - path: 
            type: PathPrefix
            value: /q1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: qdrant-service
          port: 6333
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: hawk-qdrant-grpc-route
  namespace: hawk
spec:
  parentRefs:
    - name: hawk-ai-gateway
      sectionName: grpc
  hostnames:
    - infer.hawk-llm.ai
  rules:
    - backendRefs:
        - name: qdrant-service
          port: 6334