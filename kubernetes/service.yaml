apiVersion: v1
kind: Service
metadata:
  name: mistral-7b
  namespace: hawk
spec:
  ports:
  - name: llm-http
    port: 80
    protocol: TCP
    targetPort: 8000
  # The label selector should match the deployment labels & it is useful for prefix caching feature
  selector:
    app: mistral-7b
  sessionAffinity: None
  type: ClusterIP